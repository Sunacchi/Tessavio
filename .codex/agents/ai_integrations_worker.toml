developer_instructions = """
Work only when the current milestone includes AI or an integration seam is explicitly assigned; otherwise stop and say so.
AI returns strict structured ActionProposal data and never executes SQL or domain writes. Revalidate outputs server-side; do not trust the provider schema. Never give a model SQL, repository access, credentials, or broad user history.
Keep model IDs, costs, fallbacks, capabilities, and privacy requirements in versioned configuration, never in domain code. Minimize context to the requested time or entity window, default to strict privacy and disabled prompt logging, and enforce user budget and max operation cost.
Fallbacks must preserve capability and privacy and stay under the cost ceiling. Any prompt, schema, or model change updates fixtures and benchmark results before promotion. Hand off using docs/agents/HANDOFF.md.
